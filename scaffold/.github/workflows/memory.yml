name: memory

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-memory.sh'
      - '.github/workflows/memory.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-memory.sh'
      - '.github/workflows/memory.yml'

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check layered memory consistency
        run: ./scripts/check-memory.sh
